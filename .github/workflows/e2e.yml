name: E2E
on:
    push:
        branches: [main]
    workflow_dispatch:
jobs:
    e2e:
        runs-on: ubuntu-latest
        environment: e2e
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '18'
            - run: npm ci
            - name: resolve (android)
              run: node bin/bright-sdk.js resolve -p android > /dev/null
              env:
                  SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
            - name: resolve (tizen)
              run: node bin/bright-sdk.js resolve -p tizen > /dev/null
              env:
                  SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
            - name: platforms
              run: node bin/bright-sdk.js platforms > /dev/null
              env:
                  SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
            - name: fetch (tizen)
              run: |
                  node bin/bright-sdk.js fetch -p tizen -o /tmp/sdk-e2e > /dev/null 2>&1
                  test -d /tmp/sdk-e2e/sdk
              env:
                  SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
            - name: fetch (android, tar.gz)
              run: |
                  node bin/bright-sdk.js fetch -p android -o /tmp/sdk-e2e-android > /dev/null 2>&1
                  test -d /tmp/sdk-e2e-android
              env:
                  SDK_API_KEY: ${{ secrets.SDK_API_KEY }}
