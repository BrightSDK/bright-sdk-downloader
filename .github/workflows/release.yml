name: Release
on:
    push:
        tags: ['[0-9]*']
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v4
              with:
                  node-version: '18'
            - run: npm ci

            - name: Build all platforms
              run: npm run build

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      dist/bright-sdk-downloader-linux-x64
                      dist/bright-sdk-downloader-macos-x64
                      dist/bright-sdk-downloader-macos-arm64
                      dist/bright-sdk-downloader-win-x64.exe
